name: "Semi-Autonomous Infrastructure Gate"

on:
  pull_request:
    branches: [ main ]
    paths: [ 'infra/**' ]
  push:
    branches: [ main ]
    paths: [ 'infra/**' ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate-agent-bicep:
    name: "Deterministic Gate: Lint & What-If"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Bicep Linter
        run: az bicep build --file infra/main.bicep

      - name: Azure Login (OIDC Workload Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure Deployment What-If
        run: |
          az deployment group what-if \
            --resource-group rg-contoso-prod \
            --template-file infra/main.bicep

  deploy-production-hitl:
    name: "HITL Gate: Production Deployment"
    needs: validate-agent-bicep
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Enforces required human reviewers in GitHub Environment settings before execution
    environment:
      name: production-approval-gate
    steps:
      - name: Checkout Approved Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC Workload Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Verified Bicep to Production
        run: |
          az deployment group create \
            --resource-group rg-contoso-prod \
            --template-file infra/main.bicep